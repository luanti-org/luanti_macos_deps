name: macos_deps

on:
  - push
  - pull_request

jobs:
  build_macos_deps:
    strategy:
      matrix:
        osver: [11.3,12.3]
        xcodever: [16.2]
        arch: [arm64, x86_64]
        with_angle: [no, yes]
        exclude:
          - osver: 11.3
            with_angle: yes
          - osver: 12.3
            with_angle: no
        include:
          - osver: 11.3
            xcodever: 16.2
            arch: arm64
            with_angle: no
          - osver: 11.3
            xcodever: 16.2
            arch: x86_64
            with_angle: no
          - osver: 12.3
            xcodever: 16.2
            arch: arm64
            with_angle: yes

    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deps build for macOS ${{matrix.osver}}
        run: |
          echo "REPDIR=$(pwd)" >> $GITHUB_ENV
          echo "INSTALLDIR=/Users/Shared" >> $GITHUB_ENV
          echo "osver=${{matrix.osver}}" >> $GITHUB_ENV
          echo "xcodever=${{matrix.xcodever}}" >> $GITHUB_ENV
          echo "arch=${{matrix.arch}}" >> $GITHUB_ENV
          echo "with_angle=${{matrix.with_angle}}" >> $GITHUB_ENV
          if [ "${{matrix.with_angle}}" == "yes" ]; then
            echo "ARTIFACT_NAME=macos${{matrix.osver}}_${{matrix.arch}}_angle_deps" >> $GITHUB_ENV
            echo "FILE_NAME=macos${{matrix.osver}}_${{matrix.arch}}_angle_deps.tar.gz" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=macos${{matrix.osver}}_${{matrix.arch}}_deps" >> $GITHUB_ENV
            echo "FILE_NAME=macos${{matrix.osver}}_${{matrix.arch}}_deps.tar.gz" >> $GITHUB_ENV
          fi
          brew install nasm m4 autoconf automake libtool

      - name: Download macOS SDK
        run: |
          source sdk.sh
          mkdir "$REPDIR/sources"
          install_macos_sdk $osver "$xcodever" "$REPDIR/sources"

      - name: Download/clone sources
        run: |
          source deps.sh
          source angle.sh
          cd "$REPDIR/sources"
          download_macos_deps
          if [ $with_angle == "yes" ]; then
            clone_macos_angle "$REPDIR/data"
          fi

      - name: Build deps
        run: |
          source deps.sh
          mkdir "$REPDIR/${arch}_deps"
          cd "$REPDIR/${arch}_deps"
          untar_macos_deps "$REPDIR/sources"
          build_macos_deps $arch $osver "$xcodever" "$INSTALLDIR/$ARTIFACT_NAME" $with_angle

      - name: Build ANGLE
        run: |
          if [ $with_angle == "yes" ]; then
            source angle.sh
            cd "$REPDIR/sources"
            build_macos_angle $arch $osver "$xcodever" "$INSTALLDIR/$ARTIFACT_NAME" "$REPDIR/data"
          fi

      - name: Create archive from deps
        run: |
          TARDIR=$(pwd)
          cd ${INSTALLDIR}
          tar -czvf ${TARDIR}/$FILE_NAME "$ARTIFACT_NAME"
          cd ${TARDIR}

      - name: Upload deps
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.ARTIFACT_NAME}}
          path: ./${{env.FILE_NAME}}

      - name: Upload Release Asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./${{env.FILE_NAME}}
          asset_name: ${{env.FILE_NAME}}
          overwrite: true
          tag: latest
